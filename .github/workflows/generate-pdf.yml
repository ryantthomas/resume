name: Generate Resume PDF

on:
  push:
    branches: [main]

jobs:
  generate-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: npm install playwright && npx playwright install chromium --with-deps

      - name: Generate PDF
        run: |
          node -e "
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const MARGIN = '0.4in';
            const MARGIN_IN = 0.4;
            const printW = Math.floor((8.5 - 2 * MARGIN_IN) * 96);
            const printH = Math.floor((11  - 2 * MARGIN_IN) * 96);

            const html = fs.readFileSync('index.html', 'utf8');
            const browser = await chromium.launch();
            const page = await browser.newPage();

            await page.emulateMedia({ media: 'print' });
            await page.setViewportSize({ width: printW, height: printH });
            await page.setContent(html, { waitUntil: 'networkidle' });

            await page.evaluate(function() {
              var s = document.createElement('style');
              s.id = '__fs__';
              document.head.appendChild(s);
            });

            var lo = 9, hi = 14, bestPt = 10.5;
            for (var i = 0; i < 10; i++) {
              var mid = (lo + hi) / 2;
              await page.evaluate(function(pt) {
                document.getElementById('__fs__').textContent =
                  'body { font-size: ' + pt + 'pt !important; }';
              }, mid);
              await new Promise(function(r) { setTimeout(r, 60); });
              var h = await page.evaluate(function() {
                return document.documentElement.scrollHeight;
              });
              if (h <= printH) { bestPt = mid; lo = mid; }
              else { hi = mid; }
            }

            console.log('Auto font-size: ' + bestPt.toFixed(2) + 'pt');

            await page.pdf({
              path: 'ryan-thomas-resume.pdf',
              format: 'Letter',
              printBackground: true,
              displayHeaderFooter: false,
              margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN }
            });

            await browser.close();
          })().catch(function(e) { console.error(e); process.exit(1); });
          "

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ryan-thomas-resume.pdf
          git diff --staged --quiet || git commit -m "[chore] regenerate PDF" && git push
