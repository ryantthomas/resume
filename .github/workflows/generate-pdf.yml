name: Generate Resume PDF

on:
  push:
    branches: [main]

jobs:
  generate-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: npm install playwright && npx playwright install chromium --with-deps

      - name: Generate PDF
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const html = require('fs').readFileSync('index.html', 'utf8');
            await page.setContent(html, { waitUntil: 'networkidle' });
            await page.pdf({
              path: 'ryan-thomas-resume.pdf',
              format: 'Letter',
              printBackground: true,
              displayHeaderFooter: false,
              margin: { top: '0.4in', right: '0.4in', bottom: '0.4in', left: '0.4in' }
            });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ryan-thomas-resume.pdf
          git diff --staged --quiet || git commit -m "[chore] regenerate PDF" && git push
